# Copy to config.yaml (kept out of git) and edit.

profile:
  # Your CV as .md, .txt or .pdf. Keep the real file out of git (cv.* is ignored).
  cv_path: ./cv.md
  # In your own words: what you want next. Claude reads this with your CV when scoring and writing.
  goals: >
    Operations / team-lead roles managing 10+ people, in Delhi NCR (Gurugram, Noida, Delhi)
    or remote within India. Prefer retail, e-commerce, quick commerce or logistics.
    Not interested in pure sales or field-sales targets.
  # A job passes if every word of any phrase appears in its title ("operations manager" matches "Manager - Operations").
  target_titles:
    - operations manager
    - operations lead
    - operations head
    - store manager
    - cluster manager
    - area manager
    - team lead operations
    - program manager operations
    - business operations
  # Location must contain one of these, unless remote_ok and the job is remote.
  locations: [Delhi, Gurugram, Gurgaon, Noida, NCR, Faridabad, Ghaziabad]
  remote_ok: true
  exclude_keywords: [commission only, unpaid, internship, "door to door"]
  exclude_companies: []
  max_age_days: 14

sources:
  # Company job boards that publish a public listing API. The slug is the part of the
  # careers URL after the domain, e.g. boards.greenhouse.io/<slug>, jobs.lever.co/<slug>,
  # jobs.ashbyhq.com/<slug>. Add the companies you'd like to work for.
  greenhouse: []
  lever: []
  ashby: []
  # Adzuna aggregates many Indian job sites. Free key at developer.adzuna.com;
  # put ADZUNA_APP_ID and ADZUNA_APP_KEY in your environment (or .env).
  adzuna:
    country: in
    max_days_old: 7
    searches:
      - { what: "operations manager", where: "Delhi" }
      - { what: "operations manager", where: "Gurgaon" }
      - { what: "operations manager", where: "Noida" }
      - { what: "store manager", where: "Delhi" }

scoring:
  weights: { skills_match: 0.4, seniority_fit: 0.2, domain_fit: 0.2, logistics_fit: 0.2 }
  top_n: 10 # how many jobs get tailored materials per run
  min_score: 60 # never shortlist below this
  max_jobs_per_run: 80 # cap on Claude scoring calls per run (newest first)

follow_up_days: 7
model: claude-opus-5-5
